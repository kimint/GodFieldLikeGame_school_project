<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Godfield-lite</title>
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <main class="app">
    <h1>Godfield-lite</h1>
    <p class="subtitle">
      Class-based card battle: attack / defend / buff / debuff, synergies, and an ultimate meter.
      (The original simple prototype still lives at <code>legacy/index.html</code>.)
    </p>

    <section id="class-select">
      <h2>Choose your class</h2>
      <div id="class-options" class="class-options"></div>
    </section>

    <section id="battle" hidden>
      <section class="board">
        <div class="fighter" id="cpu-panel"></div>
        <div class="fighter" id="player-panel"></div>
      </section>

      <p id="turn" class="turn"></p>

      <section>
        <h2>Your hand</h2>
        <div id="hand" class="hand"></div>
        <button id="ultimate-btn" class="ultimate-btn" disabled>Use Ultimate</button>
      </section>

      <button id="restart" class="restart">Restart</button>

      <section>
        <h2>Battle log</h2>
        <ul id="log" class="log"></ul>
      </section>
    </section>
  </main>

  <!-- Loaded in dependency order -->
  <script src="src/model/util.js"></script>
  <script src="src/model/stats.js"></script>
  <script src="src/model/damageTypes.js"></script>
  <script src="src/model/effects.js"></script>
  <script src="src/model/cardTypes.js"></script>
  <script src="src/model/synergies.js"></script>
  <script src="src/model/classes.js"></script>
  <script src="src/model/data.js"></script>
  <script src="src/model/decks.js"></script>
  <script src="src/model/engine.js"></script>
  <script src="src/app.js"></script>
</body>
</html>

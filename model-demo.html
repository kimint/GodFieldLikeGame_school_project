<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Godfield-lite Model Demo</title>
  <link rel="stylesheet" href="src/style.css" />
  <style>
    #results { list-style: none; padding: 0; font-family: monospace; }
    #results .pass { color: #7fd18a; }
    #results .fail { color: #ff8080; }
    #summary { font-weight: 700; margin: 12px 0; }
  </style>
</head>
<body>
  <main class="app">
    <h1>Data Model Smoke Test</h1>
    <p class="subtitle">
      Standalone check for the class / synergy / card data model in
      <code>src/model/</code> (see docs/DESIGN.md). Not wired into the
      playable game yet -- see <code>index.html</code> for that.
    </p>
    <p id="summary"></p>
    <ul id="results"></ul>
  </main>

  <!-- Loaded in dependency order -->
  <script src="src/model/stats.js"></script>
  <script src="src/model/damageTypes.js"></script>
  <script src="src/model/effects.js"></script>
  <script src="src/model/cardTypes.js"></script>
  <script src="src/model/synergies.js"></script>
  <script src="src/model/classes.js"></script>
  <script src="src/model/data.js"></script>
  <script src="src/model/demo.js"></script>
</body>
</html>

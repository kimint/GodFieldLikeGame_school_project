<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Godfield-lite Model Demo</title>
  <!-- ?v=N cache-buster: bump it whenever style.css or any script below
       changes -- see index.html for why. -->
  <link rel="stylesheet" href="src/style.css?v=1" />
  <style>
    #results { list-style: none; padding: 0; font-family: monospace; }
    #results .pass { color: #7fd18a; }
    #results .fail { color: #ff8080; }
    #summary { font-weight: 700; margin: 12px 0; }
  </style>
</head>
<body>
  <main class="app">
    <h1>Data Model Smoke Test</h1>
    <p class="subtitle">
      Standalone check for the class / synergy / card data model in
      <code>src/model/</code> (see docs/DESIGN.md), independent of any UI.
      For the actual playable game built on this model, see
      <code>index.html</code>; <code>src/model/engine.js</code> is the turn
      loop that wires the two together.
    </p>
    <p id="summary"></p>
    <ul id="results"></ul>
  </main>

  <!-- Loaded in dependency order. Same ?v=1 cache-buster as style.css above. -->
  <script src="src/model/stats.js?v=1"></script>
  <script src="src/model/damageTypes.js?v=1"></script>
  <script src="src/model/effects.js?v=1"></script>
  <script src="src/model/cardTypes.js?v=1"></script>
  <script src="src/model/synergies.js?v=1"></script>
  <script src="src/model/classes.js?v=1"></script>
  <script src="src/model/data.js?v=1"></script>
  <script src="src/model/demo.js?v=1"></script>
</body>
</html>
